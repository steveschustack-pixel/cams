<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Webmaster Steve's Florida Highway and Street Cameras</title>
<style>
canvas {border:#666 1px solid;background-color: #cccccc;}
.hidden {
  display: none;
}

</style>
<script>
var mfactsav = 0.25;	// default 4 up
var autoloops = 0;
var goodimages = [];
var badimages = [];
var imgset;


function loadhand() {
	var isbad = 0;
	imgset = document.getElementsByTagName('img');

	for (var i = 0; i < imgset.length ; i++) {
		isbad = 1;
		if (imgset[i].src.indexOf('//fl511.com/') != -1) {
			if (imgset[i].naturalWidth == 540) {
				imgset[i].style.display = 'none';
			} else if ((imgset[i].naturalWidth == 320) && ((imgset[i].naturalHeight == 195) || (imgset[i].naturalHeight == 196))) {
				imgset[i].style.display = 'none';
			} else if ((imgset[i].naturalWidth == 309) && (imgset[i].naturalHeight == 206)) {
				imgset[i].style.display = 'none';
			} else {
				isbad = 0;
				var wid = (window.innerWidth - 50) * mfactsav;
				goodimages[goodimages.length] = imgset[i].id;
				if (imgset[i].width != wid)
					imgset[i].width = wid;
			}
		}
		if (isbad) {
			badimages[imgset[i].id] = imgset[i].id;
			//alert("img " + i + " is bad " + isbad + ", id: " + imgset[i].id);
		}
	}
	window.addEventListener("resize", resize);
}


function rearrange(mfact) {
	var wid;
	imgset = document.getElementsByTagName('img');
	
	mfactsav = mfact;

	for (var i = 0; i < imgset.length ; i++) {
		if (imgset[i].src.indexOf('//fl511.com/') != -1) {
			if (imgset[i].style.display != 'none') {
				wid = (window.innerWidth - 50) * mfact
				if (imgset[i].width != wid)
					imgset[i].width = wid;
			}
		}
	}
}

function autoplay() {
	var loopTimer;
	if (autoloops == 0) {
		document.getElementById('candiv').style.display = 'block';
		resize();
	}
	autoplay_notmr();
	loopTimer = setTimeout(autoplay, 4000);
}

function autoplay_notmr() {
	if  (goodimages.length == 0) {
		alert("autoplay failed, no traffic images found");
		return;
	}
	const imgcount = imgset.length;
	canvas = document.getElementById('canvas');
	ctx = canvas.getContext('2d');

	//alert("#" + autoloops + ": good image img"+ ((autoloops % imgcount) + 1));
	
	var nextimg = (autoloops % imgcount) + 1;
	// no possible endless loop if no data present...e
	while (badimages["img" + nextimg] !== undefined) {
		++autoloops;
		++nextimg;
		if (nextimg > imgset.length)
			nextimg = 0;
		}
	
	img = document.getElementById("img" + nextimg);
	
	ctx.save();
	ctx.drawImage(img, 0 , 0, canvas.width, canvas.height);
	ctx.restore(); 

	++autoloops;
}

function resize() {
	const border = 40;	// 20
	// Set canvas dimensions to match the window
	canvas = document.getElementById('canvas');
	canvas.width = window.innerWidth - border;
	canvas.height = window.innerHeight - border;
	rearrange(mfactsav);
	autoplay_notmr();
	//alert("resize to " + canvas.width + ", " + canvas.height);
	/*
	ctx = canvas.getContext('2d');
	ctx.save();
	ctx.fillStyle = "rgba(200,200,200,1)";
	ctx.fillRect (0, 0, canvasWidth, canvasHeight);
	ctx.restore(); 
	*/
}  


window.addEventListener('load', loadhand, false);
</script>

<div id=candiv class=hidden>
<canvas id="canvas" width="1" height="1"></canvas>
</div>
<h1>Webmaster Steve's Florida Highway and Street Cameras</h1>
<p>Rearrange: 
<button onclick="rearrange(1)">1 Up</button>
<button onclick="rearrange(0.5)">2 Up</button>
<button onclick="rearrange(0.33)">3 Up</button>
<button onclick="rearrange(0.25)">4 Up</button>
<button onclick="autoplay()">AutoPlay</button>
