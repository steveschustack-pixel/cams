				imgset[i].style.display = 'none';
			} else {
				if (imgset[i].width != 320)
					imgset[i].width = 320;
				if (imgset[i].height != 240)
					imgset[i].height = 240;
			}
		}
	}
}

window.addEventListener('load', loadhand, false);
</script>
